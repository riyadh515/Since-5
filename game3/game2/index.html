<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الطريقة العلمية والعلوم</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#eaf4ff,#f7fbff);color:#172033;min-height:100vh}
.container{width:min(900px,94%);margin:0 auto;padding:24px 0 40px}
.hero{text-align:center;padding:12px}
.hero h1{margin:0;font-size:clamp(25px,5vw,42px);color:#164e8a}
.hero p{color:#526274}
.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 8px 30px rgba(30,70,110,.10);border:1px solid #e2eaf2}
.center{text-align:center}
input{width:min(100%,430px);padding:14px;border:2px solid #d6e0ea;border-radius:12px;font-size:17px;text-align:right}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px)}
.primary{background:#1769aa;color:#fff}
.primary:hover{background:#12598f}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:bold}
.hearts{font-size:25px;letter-spacing:3px}
.progress{height:10px;background:#e9eef4;border-radius:20px;overflow:hidden;margin:18px 0}
.bar{height:100%;background:#1769aa;width:0;transition:.3s}
.question{font-size:22px;font-weight:bold;line-height:1.7;margin:20px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{background:#f7faff;border:2px solid #d9e4ee;text-align:right;min-height:58px}
.option:hover{border-color:#1769aa;background:#eef7ff}
.option:disabled{cursor:not-allowed;opacity:.85}
.feedback{margin-top:18px;padding:14px;border-radius:13px;font-weight:bold;line-height:1.7}
.good{background:#e9f8ef;color:#176b3a}
.bad{background:#fff0ee;color:#a73525}
.next{width:100%;margin-top:14px}
.certificate{text-align:center;border:4px double #1769aa;background:linear-gradient(145deg,#fff,#f1f8ff)}
.certificate h2{font-size:32px;color:#1769aa}
.student{font-size:30px;font-weight:bold;margin:18px;color:#123e67}
.score{font-size:20px;font-weight:bold;margin:12px}
.small{font-size:13px;color:#68798a}
@media(max-width:650px){
 .card{padding:18px}
 .options{grid-template-columns:1fr}
 .question{font-size:19px}
 .hearts{font-size:22px}
}
</style>
</head>
<body>
<div class="container">
<header class="hero">
<h1>🧪 لعبة الطريقة العلمية والعلوم</h1>
<p>اختبر معلوماتك وتعلّم بطريقة ممتعة 🌱🧬</p>
</header>

<section id="start" class="card center">
<h2>👨‍🎓 ابدأ مغامرتك العلمية</h2>
<p>أدخل اسم الطالب ليظهر في شهادة الإنجاز.</p>
<input id="studentName" maxlength="50" placeholder="اكتب اسم الطالب">
<br><br>
<button id="startBtn" class="primary">🚀 ابدأ اللعبة</button>
</section>

<section id="game" class="card hidden">
<div class="top">
<div id="counter"></div>
<div id="hearts" class="hearts" aria-label="القلوب"></div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question" class="question"></div>
<div id="options" class="options"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
<button id="nextBtn" class="primary next hidden">السؤال التالي ➜</button>
</section>

<section id="result" class="card certificate hidden"></section>
</div>

<script>
(() => {
const questions = [
{q:"ما أول خطوة في الطريقة العلمية؟",a:["طرح السؤال أو تحديد المشكلة","كتابة النتيجة","جمع الأدوات فقط","إعلان الفرضية"],c:0},
{q:"ما المقصود بالفرضية؟",a:["تفسير قابل للاختبار","نتيجة نهائية مؤكدة","أداة قياس","جدول بيانات"],c:0},
{q:"ما الذي يفعله العالم لاختبار الفرضية؟",a:["يجري تجربة","يتجاهل البيانات","يغير النتيجة","يخمن فقط"],c:0},
{q:"لماذا يسجل العلماء الملاحظات والبيانات؟",a:["لتحليل النتائج والوصول إلى استنتاج","لزيادة عدد الأسئلة","لإخفاء النتائج","لإلغاء التجربة"],c:0},
{q:"إذا لم تدعم النتائج الفرضية، ماذا يفعل العالم؟",a:["يعدل الفرضية ويعيد الاختبار","يحذف البيانات","يتوقف عن التفكير العلمي","يغير النتائج"],c:0},
{q:"أي مما يلي مثال على ملاحظة علمية؟",a:["لون الورقة أخضر","أعتقد أن النبات يحتاج ضوءًا","النبات سينمو غدًا","يجب أن يكون النبات أطول"],c:0},
{q:"ما المقصود بتصنيف المخلوقات الحية؟",a:["تجميعها في مجموعات وفق صفات مشتركة","تغيير أسمائها فقط","قياس وزنها","معرفة أعمارها"],c:0},
{q:"أي مجموعة تضم مخلوقات حية حقيقية النواة؟",a:["النباتات والحيوانات والفطريات","البكتيريا فقط","الفيروسات فقط","المعادن"],c:0},
{q:"أي صفة تميز النباتات غالبًا؟",a:["تصنع غذاءها بعملية البناء الضوئي","تتغذى على الحيوانات دائمًا","لا تحتاج ماء","لا تحتوي خلايا"],c:0},
{q:"ما الجزء الذي يمتص الماء والأملاح من التربة؟",a:["الجذور","الأزهار","الثمار","الأوراق فقط"],c:0},
{q:"ما وظيفة الأوراق الأساسية في معظم النباتات؟",a:["إجراء البناء الضوئي","امتصاص الماء من التربة","تثبيت النبات فقط","إنتاج البذور دائمًا"],c:0},
{q:"أي نباتات تتكاثر بالبذور؟",a:["معظم النباتات الزهرية","الحزازيات فقط","جميع الفطريات","البكتيريا"],c:0},
{q:"ما وظيفة الزهرة في النباتات الزهرية؟",a:["المساعدة في التكاثر","امتصاص الماء","تثبيت الجذر","إنتاج الأكسجين فقط"],c:0},
{q:"أي مما يلي نبات لا يكون له أزهار حقيقية؟",a:["السراخس","الورد","التفاح","عباد الشمس"],c:0},
{q:"ما الذي يميز الحيوانات عن النباتات غالبًا؟",a:["لا تصنع غذاءها بنفسها وتحصل عليه من مصادر أخرى","تصنع غذاءها بالبناء الضوئي","لها جذور دائمًا","لا تحتاج طاقة"],c:0},
{q:"أي ترتيب يمثل مستويات تصنيفية من الأكبر إلى الأصغر بشكل صحيح؟",a:["المملكة ثم الشعبة ثم الطائفة","النوع ثم المملكة ثم الشعبة","الطائفة ثم المملكة ثم النوع","النوع ثم الجنس ثم المملكة"],c:0},
{q:"ما الوحدة الأساسية في تصنيف المخلوقات الحية؟",a:["النوع","المملكة","الشعبة","المجموعة"],c:0},
{q:"أي سؤال يصلح أن يكون سؤالًا علميًا قابلًا للاختبار؟",a:["هل يؤثر مقدار الضوء في نمو النبات؟","ما أجمل لون؟","من أفضل عالم؟","هل الطبيعة جميلة؟"],c:0},
{q:"ما المتغير الذي يغيره الباحث عمدًا في التجربة؟",a:["المتغير المستقل","المتغير التابع","الثابت","النتيجة"],c:0},
{q:"بعد تحليل البيانات، ما الخطوة المناسبة؟",a:["استخلاص الاستنتاج والتواصل بالنتائج","تجاهل البيانات","بدء التجربة دون سؤال","إخفاء النتائج"],c:0}
];

let quiz=[], current=0, hearts=3, score=0, answered=false, student="";

const $=id=>document.getElementById(id);

function shuffle(arr){
 for(let i=arr.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

function startGame(){
 student=$("studentName").value.trim() || "طالب العلوم";
 quiz=shuffle(questions.map(item=>{
   const opts=item.a.map((text,index)=>({text,index}));
   shuffle(opts);
   return {...item,a:opts.map(x=>x.text),c:opts.findIndex(x=>x.index===item.c)};
 }));
 current=0; hearts=3; score=0;
 $("start").classList.add("hidden");
 $("result").classList.add("hidden");
 $("game").classList.remove("hidden");
 render();
}

function render(){
 answered=false;
 $("counter").textContent=`السؤال ${current+1} من ${quiz.length}`;
 $("hearts").textContent="❤️".repeat(hearts)+"🤍".repeat(3-hearts);
 $("bar").style.width=((current/quiz.length)*100)+"%";
 $("question").textContent=quiz[current].q;
 $("feedback").className="feedback hidden";
 $("nextBtn").classList.add("hidden");
 const box=$("options");
 box.innerHTML="";
 quiz[current].a.forEach((text,index)=>{
   const b=document.createElement("button");
   b.className="option";
   b.type="button";
   b.textContent=`${["أ","ب","ج","د"][index]}. ${text}`;
   b.onclick=()=>answer(index);
   box.appendChild(b);
 });
}

function sound(correct){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  const ctx=new AudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=correct?720:220;
  gain.gain.setValueAtTime(.001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.08,ctx.currentTime+.03);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+.23);
 }catch(e){}
}

function answer(index){
 if(answered)return;
 answered=true;
 const correct=index===quiz[current].c;
 document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(correct){
   score++;
   sound(true);
   $("feedback").className="feedback good";
   $("feedback").textContent="✅ أحسنت! إجابة صحيحة، استمر بهذا المستوى الرائع 🌟";
 }else{
   hearts=Math.max(0,hearts-1);
   sound(false);
   $("feedback").className="feedback bad";
   $("feedback").textContent=hearts>0
     ?"💪 إجابة غير صحيحة، لا بأس! تعلّم من الخطأ وحاول في السؤال التالي."
     :"🌟 نفدت القلوب التحفيزية، لكن لا تقلق! اللعبة مستمرة حتى تكمل الأسئلة العشرين.";
 }
 $("hearts").textContent="❤️".repeat(hearts)+"🤍".repeat(3-hearts);
 $("nextBtn").textContent=current===quiz.length-1?"🏆 عرض النتيجة والشهادة":"السؤال التالي ➜";
 $("nextBtn").classList.remove("hidden");
}

function next(){
 if(!answered)return;
 if(current<quiz.length-1){current++;render();}
 else finish();
}

function finish(){
 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");
 const percent=Math.round(score/quiz.length*100);
 $("result").innerHTML=`
   <div style="font-size:48px">🏆🎓</div>
   <h2>شهادة إنجاز</h2>
   <p>تشهد هذه الشهادة بأن الطالب</p>
   <div class="student">${escapeHtml(student)}</div>
   <p>قد أكمل جميع أسئلة لعبة الطريقة العلمية والعلوم.</p>
   <div class="score">النتيجة: ${score} من ${quiz.length} — ${percent}٪</div>
   <p>🌟 أحسنت وأبدعت! واصل تعلم العلوم 🌟</p>
   <button id="restart" class="primary">🔄 إعادة اللعبة</button>
 `;
 $("restart").onclick=()=>{
   $("result").classList.add("hidden");
   $("start").classList.remove("hidden");
 };
}

function escapeHtml(str){
 return str.replace(/[&<>"']/g,ch=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[ch]));
}

$("startBtn").onclick=startGame;
$("nextBtn").onclick=next;
$("studentName").addEventListener("keydown",e=>{
 if(e.key==="Enter")startGame();
});
})();
</script>
</body>
</html>
